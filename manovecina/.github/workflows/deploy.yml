name: Deploy a Render

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - name: Solicitar despliegue en Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Falta el secreto RENDER_DEPLOY_HOOK_URL (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Despliegue solicitado"
